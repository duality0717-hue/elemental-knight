name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['codex/windows-updates-0.7.0', 'codex/elemental-sets-0.8.0']
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Verify dedicated online service
        run: node tests/cloud-live.cjs
      - run: npm run dist:win
      - name: Verify game UI and lobby
        run: ./node_modules/.bin/electron tests/desktop-ui.cjs
      - name: Install and launch on Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*Setup*.exe | Select-Object -First 1
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/Elemental Knight'
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $gamePath = Join-Path $installDir 'Elemental Knight.exe'
          if (!(Test-Path $gamePath)) { throw 'Installed executable not found' }
          $game = Start-Process $gamePath -PassThru
          Start-Sleep -Seconds 12
          $game.Refresh()
          if ($game.HasExited) { throw "Game exited early: $($game.ExitCode)" }
          Write-Output "Installed game running on Windows, process $($game.Id)"
          Stop-Process -Id $game.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Elemental-Knight-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $tag) { throw 'Tag/version mismatch' }
          $assets = @(Get-ChildItem dist/*.exe,dist/*.blockmap,dist/latest.yml | ForEach-Object FullName)
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Elemental Knight $tag" --notes-file CHANGELOG-0.8.1.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
